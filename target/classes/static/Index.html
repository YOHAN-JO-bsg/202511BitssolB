<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Weather Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        button { padding: 0.6rem 1.2rem; font-size: 1rem; }
        pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; }
        #status { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Weather API 호출 테스트</h1>
    <p>아래 버튼을 누르면 <code>/api/weather/onecall</code>을 호출해 응답을 표시합니다.</p>

    <button id="fetchBtn">날씨 불러오기</button>
    <div id="status"></div>
    <pre id="result">응답이 여기에 표시됩니다.</pre>

    <script>
        const btn = document.getElementById('fetchBtn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        async function fetchWeather() {
            statusEl.textContent = '요청 중...';
            resultEl.textContent = '';
            try {
                const res = await fetch('/api/weather/onecall');
                const text = await res.text();
                resultEl.textContent = text;
                statusEl.textContent = res.ok ? '성공' : `오류 (HTTP ${res.status})`;
            } catch (err) {
                statusEl.textContent = '네트워크 오류';
                resultEl.textContent = err.message;
            }
        }

        btn.addEventListener('click', fetchWeather);
    </script>
</body>
</html>
